# Jaccard au millième, comme q08.cypher. Braségali et Typhlosion, à moins de 0,01 de Groudon, peuvent
# prendre la 5e place (README : tolérance sur l'ordre).
[Q8.scores]
Drattak = 0.541
Dracolosse = 0.517
Reshiram = 0.490
"Libégon" = 0.485
Groudon = 0.484
"Braségali" = 0.480
