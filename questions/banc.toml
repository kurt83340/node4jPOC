# Banc d'essai (spec 002, T1.1) : les 30 questions de référence, lisibles par le harnais
# (banc/src/banc/questions.py). Le README des questions et questions/attendu/ font foi :
# banc/tests/test_banc_toml.py vérifie que ce fichier les suit.
#
# Une table [QN] par question :
# - texte : posé tel quel à l'agent ; Q2 est précédée de son préambule, sur la ligne d'avant (plan, D6) ;
# - categorie : section du README ([categories]) ; tour_precedent : Q18 et Q28 se posent dans la
#   conversation de Q2 et de Q27 ;
# - notation : le mode de pré-notation de la réponse courte (section « Réponse », plan D4) :
#   - valeur : la valeur attendue citée, juste ; sinon, faux ;
#   - ensemble : toutes citées, juste ; une partie, partiel ; aucune, faux. Un groupe un_parmi compte
#     pour une valeur : il suffit d'en citer une ;
#   - liste-ordonnee : toutes, dans l'ordre ; deux espèces dont les scores diffèrent de moins de la
#     tolérance peuvent échanger leur place (Q8) ;
#   - longue-liste : règle des longues listes, ci-dessous ; l'ensemble vient de attendu/ ;
#   - semantique : tables de l'ADR-0008, tirées de attendu/ ; au pluriel, rappel et précision ;
#     avec_types : les types sont demandés aussi (Q9) ;
#   - controle : la requête de contrôle q02.cypher, sur les 6 noms proposés (plan, D6) ;
#   - revue : revue humaine à l'aveugle, toujours (Q10, Q29, Q30 : une règle, pas de requête) ;
# - un nombre attendu se compare comme un nombre : 100 n'est pas 1000 ;
# - distracteurs : une valeur citée parmi eux fait passer la réponse « à revoir » (plan, D4) : réponse
#   comparative ou inversée, variante acceptée sous condition (forme ou talent signalés), erreur typique ;
# - revoir_si_incomplete : une réponse incomplète passe « à revoir » plutôt que partielle ou fausse,
#   car une autre réponse, expliquée, peut être juste (Q27, Q28).
#
# Règle des longues listes (Q7, Q14), écrite avant le pilote (plan, D4) : la réponse courte peut donner
# la liste complète, ou le compte avec un extrait.
# - juste : toutes les espèces de l'ensemble et aucune autre ; ou le compte exact avec au moins une
#   espèce, toutes dans l'ensemble ;
# - partiel : des espèces toutes dans l'ensemble, sans la liste complète ni le compte exact ;
# - à revoir : un distracteur, une espèce hors de l'ensemble, ou le compte exact sans aucune espèce ;
# - faux : sinon.
#
# Valeurs relevées dans attendu/ et dans les CSV du commit PokéAPI figé (2026-10-08).

[categories]
faits = "Faits simples (étalon)"
parcours = "Parcours et multi-sauts"
agregats = "Agrégations, négations, superlatifs"
semantique = "Sémantique (descriptions)"
raisonnement = "Raisonnement et mémoire (agents)"
robustesse = "Robustesse, honnêteté, algorithme de graphe"

[Q1]
texte = "Quelles attaques font le plus mal à Dracaufeu ?"
categorie = "parcours"
notation = "ensemble"
# Le type Roche (×4), puis les plus puissantes qu'au moins un Pokémon apprend (150) ; Laser Météore,
# Lame de Roc et Orage Adamantin sont bienvenus, pas exigés.
attendus = ["Roche", "Fracass’Tête", "Roc-Boulet"]
# Capacité Z (190), jamais apprise, exclue par la règle : en tête si l'agent oublie le filtre.
distracteurs = ["Hurlement des Roches-Lames"]

