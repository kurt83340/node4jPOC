# Harnais du banc d'essai (spec 002) : cellules, orchestration, notation, mesures. Il ne lit jamais le
# secret d'Aura (seul scripts/mcp-neo4j.sh le lit). Tests et contrôles :
# uv run --directory banc pytest -q (puis ruff check, mypy .).
[project]
name = "banc"
version = "0.1.0"
description = "Banc d'essai des techniques text-to-Cypher sur le graphe Pokémon"
requires-python = ">=3.14"
# Clients mesurés figés : leur version fait partie de la mesure (D10). MCP est un extra d'ADK depuis la
# v2 ; anthropic[vertex] sert la classe Claude d'ADK (l'extra « extensions » d'ADK tirerait bien plus).
# google-genai et google-auth, importés directement par banc.encodage (spec 003, D5) : déclarés le 2026-10-18,
# aux versions qu'ADK tirait déjà (uv.lock).
dependencies = [
    "anthropic[vertex]==1.11.0",
    "claude-agent-sdk==0.2.164",
    "google-adk[mcp]==2.11.0",
    "google-auth==2.60.0",
    "google-genai==2.28.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Bruit d'ADK 2.11.0 et de google-genai 2.28.0 dans les tests des cellules ADK (T4.2), sans rapport
# avec le banc : fonctions expérimentales actives, classe MCPTool qu'ADK emploie lui-même,
# sous-classe d'aiohttp.
filterwarnings = [
    "ignore:\\[EXPERIMENTAL\\] feature:UserWarning",
    "ignore:MCPTool class is deprecated:DeprecationWarning",
    "ignore:Inheritance class AiohttpClientSession:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "PTH", "C4", "PIE", "RET", "PERF", "FURB", "ERA"]
# Nombres magiques des tests, caractères ambigus (texte français)
ignore = ["PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
